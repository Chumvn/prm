<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16162b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b7fff"/>
      <stop offset="100%" style="stop-color:#7c5cfc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <g transform="translate(96,96)" filter="url(#glow)">
    <polygon points="-8,-52 18,-8 2,-8 8,52 -18,8 -2,8" fill="url(#bolt)"/>
  </g>
  <text x="96" y="160" text-anchor="middle" fill="#8888a8" font-family="Inter,sans-serif" font-size="14" font-weight="600">CHUM</text>
</svg>
