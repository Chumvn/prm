name: Build Prompt Index

on:
  push:
    paths:
      - 'prompts/*.md'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate index.json
        run: |
          cd prompts
          echo '[]' > index.json
          for f in *.md; do
            [ -f "$f" ] || continue
            SLUG=$(echo "$f" | sed 's/\.md$//' | tr ' ' '-' | tr '[:upper:]' '[:lower:]')
            TITLE=$(head -1 "$f" | sed 's/^#\s*//')
            jq --arg slug "$SLUG" \
               --arg file "prompts/$f" \
               --arg title "$TITLE" \
               '. += [{"slug":$slug,"file":$file,"title":$title}]' \
               index.json > index.json.tmp
            mv index.json.tmp index.json
          done
          cat index.json

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts/index.json
          git diff --cached --quiet || git commit -m "chore: auto-update prompts/index.json"
          git push
